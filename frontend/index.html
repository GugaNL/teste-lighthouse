<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Gerenciamento de catálogo de produtos" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#0b2b40" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0a1f2e" media="(prefers-color-scheme: dark)" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Catálogo de Produtos</title>
    <script>
      try {
        var tema = localStorage.getItem('catalogo-produtos:tema');
        if (tema === 'light' || tema === 'dark') document.documentElement.dataset.theme = tema;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
